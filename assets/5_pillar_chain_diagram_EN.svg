<svg viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a3b12"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="#fbf9f6"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1c1c">The five-pillar chain: physics + chemistry + geopolitics = a forced path</text>
  <text x="700" y="68" text-anchor="middle" font-size="15" fill="#5a5a5a">Exergy-Molecular Oil Model — summary diagram</text>

  <!-- Group box behind pillars 3 and 4 -->
  <rect x="600" y="150" width="480" height="330" rx="14" fill="none" stroke="#999999" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="840" y="140" text-anchor="middle" font-size="13" fill="#5a5a5a" font-style="italic">Wellhead to wheels</text>

  <!-- Pillar boxes: shared geometry -->
  <!-- Box 1 -->
  <g>
    <rect x="70" y="170" width="220" height="250" rx="14" fill="#2E86AB"/>
    <circle cx="105" cy="200" r="18" fill="#ffffff"/>
    <text x="105" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#2E86AB">1</text>
    <text x="180" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Refinery</text>
    <text x="180" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">energy loss</text>
    <text x="180" y="305" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">91.3%→88.0%</text>
    <text x="180" y="340" text-anchor="middle" font-size="12" fill="#e7f1f7">US light vs. Canadian dilbit</text>
    <text x="180" y="356" text-anchor="middle" font-size="12" fill="#e7f1f7">(usable energy)</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="290" y1="295" x2="325" y2="295" stroke="#333333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <g>
    <rect x="330" y="170" width="220" height="250" rx="14" fill="#A23B72"/>
    <circle cx="365" cy="200" r="18" fill="#ffffff"/>
    <text x="365" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#A23B72">2</text>
    <text x="440" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Molecular</text>
    <text x="440" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">constraint (RVP)</text>
    <text x="440" y="305" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Chemically required</text>
    <text x="440" y="340" text-anchor="middle" font-size="12" fill="#f4e3ee">Domestic shale oil is too light –</text>
    <text x="440" y="356" text-anchor="middle" font-size="12" fill="#f4e3ee">heavy-crude blending is mandatory</text>
  </g>

  <!-- Arrow 2->3 -->
  <line x1="550" y1="295" x2="625" y2="295" stroke="#333333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <g>
    <rect x="630" y="180" width="210" height="120" rx="12" fill="#F18F01"/>
    <circle cx="662" cy="205" r="15" fill="#ffffff"/>
    <text x="662" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#F18F01">3</text>
    <text x="735" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Engine efficiency to</text>
    <text x="735" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">shaft work</text>
    <text x="735" y="260" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Otto vs. Diesel</text>
    <text x="735" y="282" text-anchor="middle" font-size="10.5" fill="#fdecd2">thermal-cycle efficiency,</text>
    <text x="735" y="295" text-anchor="middle" font-size="10.5" fill="#fdecd2">not just to the tank</text>
  </g>

  <!-- Arrow 3->4 (down) -->
  <line x1="735" y1="300" x2="735" y2="325" stroke="#333333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 4 -->
  <g>
    <rect x="630" y="330" width="210" height="90" rx="12" fill="#C73E1D"/>
    <circle cx="662" cy="352" r="15" fill="#ffffff"/>
    <text x="662" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#C73E1D">4</text>
    <text x="735" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">EROI, wellhead-</text>
    <text x="735" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">to-wheels</text>
    <text x="735" y="400" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">EROI &lt; 1.0</text>
  </g>
  <text x="735" y="430" text-anchor="middle" font-size="10.5" fill="#8a3b12">Canada-SCO and dilbit chains,</text>
  <text x="735" y="443" text-anchor="middle" font-size="10.5" fill="#8a3b12">even with peak-efficiency engines</text>

  <!-- Arrow 4->5 -->
  <line x1="850" y1="295" x2="1085" y2="295" stroke="#333333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Box 5 -->
  <g>
    <rect x="1090" y="170" width="240" height="250" rx="14" fill="#4C956C"/>
    <circle cx="1125" cy="200" r="18" fill="#ffffff"/>
    <text x="1125" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#4C956C">5</text>
    <text x="1210" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Geopolitical</text>
    <text x="1210" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">vulnerability</text>
    <text x="1210" y="308" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">77%</text>
    <text x="1210" y="340" text-anchor="middle" font-size="12" fill="#e2f0e8">Venezuela+Mexico account for the</text>
    <text x="1210" y="356" text-anchor="middle" font-size="12" fill="#e2f0e8">2016–26 heavy-import</text>
    <text x="1210" y="372" text-anchor="middle" font-size="12" fill="#e2f0e8">collapse</text>
  </g>

  <!-- Feedback loop from Box5 back to Box1/2 -->
  <path d="M 1210 436 C 1210 490, 300 490, 300 436" fill="none" stroke="#8a3b12" stroke-width="2.5" stroke-dasharray="2,4" marker-end="url(#arrowRed)"/>
  <text x="755" y="515" text-anchor="middle" font-size="13" fill="#8a3b12" font-style="italic">
    The narrow supplier base (5) perpetuates the molecular constraint (2) and the energy loss (1, 3–4)
  </text>

  <!-- Bottom summary line -->
  <rect x="70" y="540" width="1260" height="60" rx="10" fill="#efe9e0" stroke="#c9bfa8" stroke-width="1.5"/>
  <text x="700" y="565" text-anchor="middle" font-size="13.5" fill="#3a3a3a">You find the oil, you're relieved — but its type physically and geopolitically</text>
  <text x="700" y="584" text-anchor="middle" font-size="13.5" fill="#3a3a3a">locks you into a narrow corridor nobody planned in advance.</text>
</svg>
